<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game X Character Builder</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body data-theme="na" class="login-page">
  <main class="page">
    <section class="card">
      <p class="section-kicker">Loading</p>
      <h1>Game X Character Builder</h1>
      <p id="status" class="muted status-text">Checking sign-in…</p>
      <nav class="row actions-row" aria-label="Fallback navigation">
        <a class="btn" href="/characters.html">Characters</a>
        <a class="btn secondary" href="/login.html">Login</a>
      </nav>
    </section>
  </main>

  <script type="module">
    import { onAuth, initAuthRedirectHandling } from "/js/core/auth-ui.js";

    const statusEl = document.getElementById("status");

    // If a redirect-based sign-in ever lands on / (root), process it safely.
    await initAuthRedirectHandling();

    onAuth((user) => {
      if (statusEl) statusEl.textContent = user ? "Signed in — redirecting…" : "Signed out — redirecting…";
      window.location.replace(user ? "/characters.html" : "/login.html");
    });
  </script>
</body>
</html>
